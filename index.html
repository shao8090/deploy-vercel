<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Highway</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{

background:
radial-gradient(circle at center,#420000 0%,#120000 20%,#000 70%),
linear-gradient(#050505,#000);

display:flex;
justify-content:center;
align-items:center;
}

.poster{

position:relative;

width:100vw;
height:100vh;

overflow:hidden;

}

/* VHS Noise */

.poster:before{

content:"";

position:absolute;
inset:-50%;

background-image:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.04) 0px,
rgba(255,255,255,.04) 1px,
transparent 2px,
transparent 4px
);

animation:noise .18s infinite;

opacity:.18;

mix-blend-mode:screen;

}

@keyframes noise{

0%{transform:translate(0,0);}
25%{transform:translate(-2%,1%);}
50%{transform:translate(1%,-2%);}
75%{transform:translate(3%,1%);}
100%{transform:translate(0,0);}

}

/* Highway */

.road{

position:absolute;

bottom:-15%;

left:50%;

transform:translateX(-50%) perspective(800px) rotateX(75deg);

width:170%;

height:80%;

background:
linear-gradient(#0d0d0d,#000);

}

.line{

position:absolute;

left:50%;

bottom:0;

width:10px;

height:100%;

transform:translateX(-50%);

background:
repeating-linear-gradient(
to bottom,
#ffe66d 0px,
#ffe66d 50px,
transparent 50px,
transparent 100px
);

animation:drive 1.2s linear infinite;

filter:blur(.4px);

}

@keyframes drive{

from{
background-position:0 0;
}

to{
background-position:0 100px;
}

}

/* Glow */

.glow{

position:absolute;

top:18%;

left:50%;

transform:translateX(-50%);

width:500px;
height:500px;

border-radius:50%;

background:

radial-gradient(circle,
rgba(255,0,0,.35),
rgba(255,0,0,.05),
transparent 70%);

filter:blur(60px);

}

/* Title */

.title{

position:absolute;

top:8%;

width:100%;

text-align:center;

font-size:7vw;

letter-spacing:.35em;

font-weight:900;

color:white;

text-transform:uppercase;

text-shadow:
0 0 15px red,
0 0 40px red;

}

.subtitle{

position:absolute;

top:20%;

width:100%;

text-align:center;

font-size:1rem;

letter-spacing:.55em;

color:#999;

text-transform:uppercase;

}

/* Quote */

.quote{

position:absolute;

bottom:18%;

width:100%;

text-align:center;

font-size:1.2rem;

font-style:italic;

color:#ddd;

letter-spacing:.12em;

text-shadow:0 0 8px rgba(255,255,255,.2);

}

/* Credits */

.credits{

position:absolute;

bottom:4%;

width:100%;

text-align:center;

font-size:.8rem;

color:#666;

letter-spacing:.25em;

text-transform:uppercase;

}

.redflare{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:
linear-gradient(
120deg,
transparent 0%,
rgba(255,0,0,.08) 45%,
transparent 60%
);

mix-blend-mode:screen;

animation:flare 8s linear infinite;

}

@keyframes flare{

0%{transform:translateX(-60%);}
100%{transform:translateX(80%);}

}

</style>

</head>

<body>

<div class="poster">

<div class="road"></div>

<div class="line"></div>

<div class="glow"></div>

<div class="redflare"></div>

<div class="title">
LOST HIGHWAY
</div>

<div class="subtitle">
A FILM BY DAVID LYNCH
</div>

<div class="quote">
" We've met before, haven't we? "
</div>

<div class="credits">
1997 • PSYCHOLOGICAL • NEO-NOIR • SURREAL
</div>

</div>

</body>
</html>
